name: Build Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      # This repo's ./gradlew wrapper script is included, but the binary
      # gradle-wrapper.jar is intentionally NOT committed (see README).
      # Regenerate it here using the Gradle installed by setup-gradle above,
      # so ./gradlew works for the rest of this workflow exactly as it would
      # on a contributor's machine after they run this once locally.
      - name: Generate Gradle wrapper jar
        run: gradle wrapper --gradle-version 8.7
      - run: chmod +x ./gradlew

      - name: Create debug keystore for release signing
        run: |
          keytool -genkeypair -v \
            -keystore app/debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=AI Note Manager, OU=Dev, O=Dev, L=Dev, S=Dev, C=US"
        # Note: for a real production release, replace this step with restoring a
        # real signing keystore from GitHub Secrets instead (see README).

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
